site_name: jaxfne
site_description: JAX-based TFNE scaffold for multimodal source-to-field/readout workflows
site_url: https://jaxfne.readthedocs.io/

repo_url: https://github.com/HNXJ/jaxfne
repo_name: HNXJ/jaxfne

docs_dir: docs

# docs/_generated/version.md is a machine-written/machine-read source-of-truth
# for scripts/sync_docs_version.py + scripts/sync_release_metadata.py, not a
# human-facing page -- excluded so mkdocs stops flagging it as an orphan not
# in nav (cosmetic INFO warning only, never failed --strict, but the file was
# never meant to be navigable).
exclude_docs: |
  _generated/version.md

theme:
  name: material
  logo: assets/jaxfne-img.png
  favicon: assets/jaxfne-img.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: orange
      accent: gray

extra_css:
  - _theme_override.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
      smart_dollar: false
      tex_inline_wrap: ["\\(", "\\)"]
      tex_block_wrap: ["\\[", "\\]"]
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

