          - H-to-X Gain: doctrine/protocol_h_h1b_h_to_x_gain.md
          - RBD State Memory: doctrine/protocol_h_rbd_memory.md
          - HDP Parameter Memory: doctrine/protocol_w_hdp_parameter_memory.md
          - TFNE Algebra: doctrine/tfne_algebra.md
          - Relative Quantities: doctrine/relative_quantity_grammar.md
          - TFNE Containment and Composition: doctrine/tfne_containment_architecture.md
          - TFNE–JDNA Boundary: doctrine/tfne_jdna_boundary.md

  - API:
      - Overview: api/index.md
      - Core: api/core.md
      - Runtime: api/runtime.md
      - Emitters: api/emitters.md
      - Source schema: api/source_schema.md
      - Field schema: api/field_schema.md
      - Fields: api/fields.md
      - Probes: api/probes.md
      - Objectives: api/objectives.md
      - NeuronalTensor: api/neuronal_tensor.md
