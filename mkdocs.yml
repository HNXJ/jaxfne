site_name: jaxfne
site_description: Tensor-Field Neural Equations — JAX simulation for neural circuits, fields, and adaptation
site_url: https://jaxfne.readthedocs.io/

repo_url: https://github.com/HNXJ/jaxfne
repo_name: HNXJ/jaxfne

docs_dir: docs

