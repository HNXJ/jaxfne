  # non-navigable on the public site -- delivery artifacts, not user docs.
  theory/publication/results_reconstruction/drafts/abstract_draft.md
  theory/publication/results_reconstruction/traceability/abstract_traceability_map.md
  theory/publication/results_reconstruction/drafts/results_draft.md
  theory/publication/results_reconstruction/traceability/traceability_map.md
  theory/publication/results_reconstruction/drafts/methods_draft.md
  theory/publication/results_reconstruction/traceability/methods_traceability_map.md
