  publication/results_reconstruction/introduction_traceability_map.md
  publication/results_reconstruction/discussion_draft.md
  publication/results_reconstruction/discussion_traceability_map.md
  publication/manuscript/*
  publication/manuscript/abstract.md
  publication/manuscript/discussion.md
  publication/manuscript/introduction.md
  publication/manuscript/methods.md
  publication/manuscript/results.md
  publication/manuscript/supplement.md

theme:
  name: material
  logo: assets/jaxfne-img.png
  favicon: assets/jaxfne-img.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: orange
      accent: gray

extra_css:
  - _theme_override.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
      smart_dollar: false
      tex_inline_wrap: ["\\(", "\\)"]
      tex_block_wrap: ["\\[", "\\]"]
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

