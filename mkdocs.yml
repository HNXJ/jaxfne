site_name: jaxfne
site_description: Biophysical source-field modeling — neural activity, biophysical state, plasticity, geometry, and population- and field-scale dynamics
site_url: https://jaxfne.readthedocs.io/

repo_url: https://github.com/HNXJ/jaxfne
repo_name: HNXJ/jaxfne

docs_dir: docs

# Stand-ins for atlas HTML a checkout has not built (scripts/build_docs_assets.py --build).
hooks:
  - scripts/mkdocs_atlas_stubs.py
  # Old URLs of pages moved on 2026-10-16 forward to the new ones (extra.redirect_maps).
  - scripts/mkdocs_redirects.py

