  theory/publication/results_reconstruction/drafts/introduction_draft.md
  theory/publication/results_reconstruction/traceability/introduction_traceability_map.md
  theory/publication/results_reconstruction/drafts/discussion_draft.md
  theory/publication/results_reconstruction/traceability/discussion_traceability_map.md
  publication/manuscript/*
  theory/publication/manuscript/abstract.md
  theory/publication/manuscript/discussion.md
  theory/publication/manuscript/introduction.md
  theory/publication/manuscript/methods.md
  theory/publication/manuscript/results.md
  theory/publication/manuscript/supplement.md

theme:
  name: material
  logo: assets/jaxfne-img.png
  favicon: assets/jaxfne-img.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    # Two schemes with a toggle (as in jnwb); `media` makes the first entry the default for a
    # visitor whose OS prefers dark. Colors come from docs/_static/theme_override.css.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

extra_css:
  - _static/theme_override.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - _static/mermaid_init.js
  - _static/figure_theme.js

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
      smart_dollar: false
      tex_inline_wrap: ["\\(", "\\)"]
      tex_block_wrap: ["\\[", "\\]"]
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

