site_name: jaxfne
site_description: Biophysical source-field modeling — neural activity, biophysical state, plasticity, geometry, and population- and field-scale dynamics
site_url: https://jaxfne.readthedocs.io/

repo_url: https://github.com/HNXJ/jaxfne
repo_name: HNXJ/jaxfne

docs_dir: docs

exclude_docs: |
  _generated/version.md
  for_ai_agents.md
  BASELINE_DRIVE_REFERENCE.md
  CORTEX_CALIBRATION_CHECKLIST.md
  NEURON_IO_CHARACTERIZATION.md
  performance_baseline.md
  notes/brian2_benchmark_receipt.md
  releases/v0.2.0.md
  releases/v0.2.1.md
  releases/v0.2.3.md
  releases/v0.2.10.md
  releases/v0.2.18.md
  releases/v0.3.4.md
  conservation_proxy_diagnostics.md
  interactive_visualizations.md
  operator_doctrine.md
  tensor_electromagnetics_scope.md
  tensor_network_ancestry.md
  doctrine/rbs_rbd_hdp_inventory.md
  publication/evidence_consolidation.md
  publication/figures_1_7_cross_audit_summary.md
  ci_policy.md
  tutorial_figures.md
  _generated/operator_inventory.md
  api/bridges.md
  api/plasticity.md
  api/sharding.md
  api/solvers.md
  api/tensor_operators.md
  guides/jax_fem_interop.md
  guides/plotly_visualization.md
  guides/poisson_admissibility.md
  guides/showcases.md
  guides/solver_acceptance.md
  guides/zenodo_doi.md
  notes/biophysical_model_comparison.md
  reference/glossary_of_methods.md
  # Manuscript-in-progress working files (Publication phase): deliberately
  # non-navigable on the public site -- delivery artifacts, not user docs.
  publication/results_reconstruction/abstract_draft.md
  publication/results_reconstruction/abstract_traceability_map.md
  publication/results_reconstruction/results_draft.md
  publication/results_reconstruction/traceability_map.md
  publication/results_reconstruction/methods_draft.md
  publication/results_reconstruction/methods_traceability_map.md
  publication/results_reconstruction/supplement_material.md
  publication/results_reconstruction/supplement.md
  publication/results_reconstruction/supplement_traceability_map.md
  publication/results_reconstruction/introduction_draft.md
  publication/results_reconstruction/introduction_traceability_map.md
  publication/results_reconstruction/discussion_draft.md
  publication/results_reconstruction/discussion_traceability_map.md
  publication/manuscript/*
  publication/manuscript/abstract.md
  publication/manuscript/discussion.md
  publication/manuscript/introduction.md
  publication/manuscript/methods.md
  publication/manuscript/results.md
  publication/manuscript/supplement.md

theme:
  name: material
  logo: assets/jaxfne-img.png
  favicon: assets/jaxfne-img.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: orange
      accent: gray

extra_css:
  - _theme_override.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
      smart_dollar: false
      tex_inline_wrap: ["\\(", "\\)"]
      tex_block_wrap: ["\\[", "\\]"]
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Getting started:
      - Welcome: index.md
      - Installation: install.md
      - Quickstart: quickstart.md
      - Colab quick start: colab.md
      - Gallery: gallery.md
      - Public API: public_surface_contract.md
      - Scope & status: scope_and_status.md
      - Limitations & roadmap: limitations_and_future_plans.md
      - Migration guide: migration_guide.md
      - FAQ: faq.md

  - Tutorials:
      - Overview: tutorials/index.md
      - Notebook standard: tutorials/notebook_standard.md
      - Tutorial Outputs: tutorials/tutorial_outputs.md
      - Canonical path (recommended, 1000n):
          - Define (PseudoGenome): tutorials/01_define_genome.md
          - Develop (G→N): tutorials/02_develop_genome.md
          - Inspect (realized vs configured): tutorials/03_inspect_tensor.md
          - Simulate (construct→Signals): tutorials/04_simulate_tensor.md
          - Observe (field & probe): tutorials/05_observe_fields.md
          - Add state (H / RBS): tutorials/06_add_state.md
          - Add dynamics (HDP): tutorials/07_add_dynamics.md
          - Compare (nulls & lesions): tutorials/08_compare_nulls.md
      - Suites (multi-part courses):
          - Suite 1 — Computational biophysics: tutorials/06_jaxfne_suite_no_1_computational_biophysics.md
          - Suite 2a — Spectrolaminar motif: tutorials/07_jaxfne_suite_no_2_spectrolaminar_motif.md
          - Suite 2b — Evoked L4 drive: tutorials/08_jaxfne_suite_no_2_evoked_l4_drive.md
          - Suite 3 — Low-frequency scaling: tutorials/08_jaxfne_suite_no_3_low_frequency_scaling.md
      - Archive (pre-canonical, superseded):
          - "Archive: Single-neuron multimodal": tutorials/01_single_neuron_multimodal.md
          - "Archive: Two-neuron E/I": tutorials/02_two_neuron_ei.md
          - "Archive: Population E/I network": tutorials/03_network_100_ei.md
          - "Archive: V1 laminar column": tutorials/04_v1_column.md
          - "Archive: V1–PFC dual column": tutorials/05_v1_pfc_dual_column.md
          - "Archive: Configuration API population": tutorials/06_v036_100_neuron_ei_population.md
          - "Archive: Canonical column étude": tutorials/13_canonical_column_etude.md
          - "Archive: Source bookkeeping": tutorials/07_v037_source_bookkeeping.md
          - "Archive: LFP and CSD proxies": tutorials/08_v038_lfp_csd_readout.md
          - "Archive: EEG, MEG, EMM proxies": tutorials/09_v0310_eeg_meg_emm_proxy_bundle.md
          - "Archive: Sensory omission oddball": tutorials/10_v0313_omission_oddball.md
          - "Archive: Multi-area laminar AGSDR": tutorials/11_multi_laminar_cortical_agsdr.md
          - "Archive: Izhikevich emitter explorer": tutorials/12_izhikevich_single_emitter_explorer.md

  - Guides:
      - Overview: guides/index.md
      - Grammar:
          - Configuration grammar: guides/configuration_grammar.md
          - Objective grammar: guides/objective_grammar.md
          - PseudoGenome (JDNA): guides/jdna.md
          - Model inspection: guides/model_inspection.md
      - State and adaptation:
          - H-state and HDP: guides/hdp.md
          - Homeostasis: guides/homeostasis.md
          - Calibration: guides/calibration.md
      - Readout and outputs:
          - Probe operators: guides/probe_operators.md
          - Output bundles: guides/output_bundles.md
          - Tensor-field workflows: guides/tensor_field_workflows.md
          - Operator composition: guides/operator_composition.md
      - Interop and visualization:
          - Jaxley interoperability: guides/jaxley_interop.md
          - Canonical Atlas Suite: guides/atlas_suite.md

  - Études:
      - Overview: etudes/index.md
      - Multiscale observation (frozen): etudes/multiscale_observation.md
      - Experiment A — Canonical multiscale (builds on Multiscale): etudes/experiment_a.md
      - Heterogeneous emitters: etudes/heterogeneous_emitters.md
      - HDP controllability & reachability: etudes/hdp_controllability_reachability.md

  - Theory and Experiments:
      - Foundations:
          - Fundamental laws: appendix/fundamental_laws.md
          - Source and field equations: source_field_equations.md
          - Computation basis: computation_basis.md
          - Mathematical glossary: mathematical_glossary_flow.md
      - Waves and geometry:
          - Traveling Waves: protocols/protocol_c_wave.md
          - Traveling-Wave Evidence: doctrine/protocol_c_wave_evidence.md
          - Neural Geometry and Delays: protocols/protocol_c_c3_neural.md
          - Biological RBS: protocols/protocol_d_biological_rbs.md
          - Integrated TFNE Composition: protocols/protocol_e_integration.md
      - State, memory and composition:
