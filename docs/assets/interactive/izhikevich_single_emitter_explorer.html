        // Physiological interneurons, pyramidal cells, and accessory presets

        function App() {
            // State controllers
            const [a, setA] = useState(0.02);
            const [b, setB] = useState(0.20);
            const [c, setC] = useState(-65);
            const [d, setD] = useState(8.0);
            const [I, setI] = useState(10.0);
            const [spikeWidth, setSpikeWidth] = useState(2.0); // ms
            const [biphasicDepth, setBiphasicDepth] = useState(5.0); // mV

            // Visualization Crop Sliders (left defaults to 0ms, right defaults to 20ms)
            const [cropLeft, setCropLeft] = useState(0); // ms
            const [cropRight, setCropRight] = useState(20); // ms

            // Waveform generator configuration
            const [inputType, setInputType] = useState('constant'); 
            const [sineFreq, setSineFreq] = useState(15); 
            const [stepStart, setStepStart] = useState(40); 
            const [stepEnd, setStepEnd] = useState(160); 

            // UI Tabs
            const [activeTab, setActiveTab] = useState('biophysics');
            const [hoveredParam, setHoveredParam] = useState(null);
            const [copied, setCopied] = useState(false);
            const [hoveredDataPoint, setHoveredDataPoint] = useState(null);

            // Solver configurations
            const dt = 0.25; 
            const totalTime = 200; 
            const steps = totalTime / dt;

            // Crop slide guard to prevent intersection
            const handleCropLeftChange = (val) => {
                const numVal = parseInt(val);
                if (numVal < cropRight - 1) {
                    setCropLeft(numVal);
                }
            };

            const handleCropRightChange = (val) => {
                const numVal = parseInt(val);
                if (numVal > cropLeft + 1) {
                    setCropRight(numVal);
                }
            };

            // Biophysical continuous repolarization step solver
            const simulationData = useMemo(() => {
                let v = -70.0; 
                let u = b * v;  
                const results = [];
                
                let spike_phase = 0; // 0 = integration state, 1 = AP active downstroke
                let spike_duration_steps = Math.max(1, Math.round(spikeWidth / dt));
                let spike_step_count = 0;

                for (let step = 0; step < steps; step++) {
                    const t = step * dt;
                    
                    let inputDrive = 0;
                    if (inputType === 'constant') {
                        inputDrive = I;
                    } else if (inputType === 'step') {
                        inputDrive = (t >= stepStart && t <= stepEnd) ? I : 0;
                    } else if (inputType === 'sine') {
                        inputDrive = I * (1 + Math.sin(2 * Math.PI * sineFreq * (t / 1000)));
                    } else if (inputType === 'pulseTrain') {
                        inputDrive = (Math.floor(t / 40) % 2 === 0) && (t % 40 < 10) ? I : 0;
                    }

                    if (spike_phase > 0) {
                        spike_step_count++;
                        const pct = spike_step_count / spike_duration_steps;
                        
                        // Drop voltage from threshold peak (+30mV) down to c - biphasicDepth
                        const v_start = 30.0;
                        const v_end = c - biphasicDepth;
                        const cos_pct = (1 - Math.cos(pct * Math.PI)) / 2;
                        v = v_start + (v_end - v_start) * cos_pct;
                        
                        // Increment recovery variable u during repolarization downstroke
                        u += (d / spike_duration_steps);

                        results.push({ t, v, u, I: inputDrive, spiked: false });
                        
                        if (spike_step_count >= spike_duration_steps) {
                            spike_phase = 0;
                            v = c; 
                        }
                    } else {
                        const dv = 0.04 * v * v + 5 * v + 140 - u + inputDrive;
                        const du = a * (b * v - u);

                        v += dv * dt;
                        u += du * dt;

                        if (v < -95.0) v = -95.0;

                        if (v >= 30.0) {
                            spike_phase = 1;
                            spike_step_count = 0;
                            results.push({ t, v: 30.0, u, I: inputDrive, spiked: true });
                        } else {
                            results.push({ t, v, u, I: inputDrive, spiked: false });
                        }
                    }
                }
                return results;
            }, [a, b, c, d, I, inputType, sineFreq, stepStart, stepEnd, steps, spikeWidth, biphasicDepth]);

            // Presets trigger
            const handleApplyPreset = (preset) => {
                setA(preset.a);
                setB(preset.b);
                setC(preset.c);
                setD(preset.d);
                setI(preset.I);
                setSpikeWidth(preset.spikeWidth || 2.0);
                setBiphasicDepth(preset.biphasicDepth || 5.0);
                setInputType(preset.inputType || 'constant');
            };

            // SVG scales for Right Plot
            const svgWidth = 800;
            const svgHeight = 310;
            const padding = 45;

            // Crop filter boundaries
            const xScale = (t) => {
                const norm = (t - cropLeft) / (cropRight - cropLeft);
                return padding + norm * (svgWidth - 2 * padding);
            };

            const yScaleV = (v) => svgHeight - padding - ((v - (-95)) / (45 - (-95))) * (svgHeight - 2 * padding);
            const yScaleI = (curr) => svgHeight - padding/2 - (curr / 30) * (padding); 

            // Extract dynamic cropped trajectory vectors
            const paths = useMemo(() => {
                let vSegs = [];
                let uSegs = [];
                let iSegs = [];

                simulationData.forEach((d) => {
                    // Filter down to crop range
                    if (d.t >= cropLeft && d.t <= cropRight) {
                        const x = xScale(d.t);
                        const yV = yScaleV(d.v);
                        const yI = yScaleI(d.I);
                        
                        const mappedU = -70 + ((d.u - (-20)) / (25 - (-20))) * 60;
                        const yU = yScaleV(mappedU);

                        vSegs.push(`${x},${yV}`);
                        uSegs.push(`${x},${yU}`);
                        iSegs.push(`${x},${yI}`);
                    }
                });

                return {
                    vPath: vSegs.join(' L '),
                    uPath: uSegs.join(' L '),
                    iPath: iSegs.join(' L ')
                };
            }, [simulationData, cropLeft, cropRight]);

            // Phase space dimensions and scale functions
            const phaseSize = 250;
            const phasePad = 40;
            const phaseXScale = (v) => phasePad + ((v - (-90)) / (-40 - (-90))) * (phaseSize - 2 * phasePad);
            const phaseYScale = (u) => phaseSize - phasePad - ((u - (-25)) / (15 - (-25))) * (phaseSize - 2 * phasePad);

            const vRange = useMemo(() => {
                const arr = [];
                for (let val = -95; val <= -35; val += 1) {
                    arr.push(val);
                }
                return arr;
            }, []);

            const nullclines = useMemo(() => {
                const vNull = vRange.map(v => {
                    const u = 0.04 * v * v + 5 * v + 140 + I;
                    return { v, u };
                });
                const uNull = vRange.map(v => {
                    const u = b * v;
                    return { v, u };
                });
                return { vNull, uNull };
            }, [b, I, vRange]);

            // Phase Space computations
            const phasePaths = useMemo(() => {
                const traj = simulationData
                    .filter(pt => pt.t >= cropLeft && pt.t <= cropRight)
                    .map(pt => `${phaseXScale(pt.v)},${phaseYScale(pt.u)}`)
                    .join(' L ');
                
                const vNullPath = nullclines.vNull.map(pt => `${phaseXScale(pt.v)},${phaseYScale(pt.u)}`).join(' L ');
                const uNullPath = nullclines.uNull.map(pt => `${phaseXScale(pt.v)},${phaseYScale(pt.u)}`).join(' L ');

                return { traj, vNullPath, uNullPath };
            }, [nullclines, simulationData, cropLeft, cropRight]);

            const generatedCode = `import jaxfne as jtfne

# Config snippet generated from Reduced-emitter waveform preview panel.
# Authoritative simulation: use the package-native jaxfne notebook cells below.
single_emitter_preview = {
    "a": ${a.toFixed(4)},
    "b": ${b.toFixed(4)},
    "c": ${c.toFixed(1)},
    "d": ${d.toFixed(4)},
    "drive_native": ${I.toFixed(2)},
    "display_spike_width_ms": ${spikeWidth.toFixed(2)},
    "display_biphasic_depth_mv": ${biphasicDepth.toFixed(1)},
    "preview_solver": "browser_euler",
    "authoritative_path": "package_native_jaxfne_notebook_cells",
}
`;

            const copyToClipboard = () => {
                const el = document.createElement('textarea');
                el.value = generatedCode;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            const paramMap = {
                a: {
                    title: "Parameter 'a' (Refractory Decay Rate)",
                    biology: "Represents the inactivation kinetics of voltage-gated potassium and sodium leak channels. Smaller values prolong recovery duration.",
                    transistor: "Feedback RC time constant. Regulates Gate capacitance discharge speed."
                },
                b: {
                    title: "Parameter 'b' (Subthreshold Sensitivity)",
                    biology: "Determines the electrical coupling between membrane voltage fluctuations and recovery variables.",
                    transistor: "Drain-to-gate body leakage bias. Governs active transconductance feedback."
                },
                c: {
                    title: "Parameter 'c' (Voltage Reset Target)",
                    biology: "The polarized repolarization potential established post-spike by delayed rectifier K+ gates.",
                    transistor: "Ground-clamp shunting reference. Establishes the capacitor's base reset voltage."
                },
                d: {
                    title: "Parameter 'd' (Calcium-Driven Adaptation Step)",
                    biology: "Abstraction of calcium-sensitive potassium current efflux (SK/BK gates) causing transient spike frequency decay.",
                    transistor: "Feedback charge multiplier. Induces an instantaneous post-reset voltage increment."
                },
                I: {
                    title: "Parameter 'I' (Input Current Drive)",
                    biology: "Sum of depolarizing and hyperpolarizing ligand-gated chemical currents bound to dendrites.",
                    transistor: "The continuous DC bias current injected directly into the Drain output capacitance node."
                },
                spikeWidth: {
                    title: "AP Downstroke Width (τ_AP)",
                    biology: "Models sodium gate inactivation duration. Exceedingly small widths generate narrow interneuron spikes.",
                    transistor: "Drain-to-Source short-circuit conduction width."
                },
                biphasicDepth: {
                    title: "Biphasic AHP Undershoot Depth (V_AHP)",
                    biology: "The magnitude of the afterhyperpolarization (AHP) dip. Pulls potential below the resting c target.",
                    transistor: "Transient reverse gate bias, shunting the drain node voltage deep below rest."
                }
            };

            return (
                <div className="min-h-screen bg-[#0d0d10] text-gray-100 font-sans pb-12">
                    {/* Header bar */}
                    <header className="border-b border-gray-800 bg-[#121217]/90 backdrop-blur sticky top-0 z-40 px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
                        <div className="flex items-center gap-3">
                            <div className="p-2 bg-gradient-to-tr from-purple-950 via-purple-900 to-[#e2b43c]/80 rounded-lg text-white shadow-lg shadow-purple-500/10">
                                <ZapIcon />
                            </div>
                            <div>
                                <h1 className="text-lg font-bold tracking-tight bg-gradient-to-r from-gray-100 via-[#e2b43c] to-purple-400 bg-clip-text text-transparent uppercase font-mono">
                                    jaxfne TFNE-Izhikevich Single Emitter Explorer
                                </h1>
                                <p className="text-[10px] text-gray-400 uppercase tracking-widest font-mono">
                                    Reduced-emitter waveform preview • Gold & Purple Neuromorphic Edition
                                </p>

                                                            🧠 Biophysical Mechanism:
                                                        </span>
                                                        <p className="text-xs text-gray-300 leading-relaxed">
                                                            {paramMap[hoveredParam].biology}
                                                        </p>
                                                    </div>
                                                    <div>
                                                        <span className="text-[9px] font-bold text-purple-400 tracking-wider uppercase block">
                                                            🔌 Semiconductor Analogy:
                                                        </span>
                                                        <p className="text-xs text-gray-300 leading-relaxed">
                                                            {paramMap[hoveredParam].transistor}
                                                        </p>
                                                    </div>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="bg-[#171721]/50 p-6 rounded border border-dashed border-gray-800 flex flex-col items-center justify-center text-center">
                                                <CpuIcon className="w-8 h-8 text-purple-800 mb-2 animate-pulse" />
                                                <span className="text-xs font-mono text-gray-400">
                                                    Hover over parameter label compartments inside the left panel.
                                                </span>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Phase Portrait */}
                                <div className="xl:col-span-5 bg-[#121217] border border-gray-800 rounded-xl p-5 shadow-2xl flex flex-col justify-between">
                                    <div>
                                        <h4 className="font-bold text-xs tracking-wider uppercase text-gray-200 flex items-center gap-1.5 mb-1 font-mono">
                                            <ActivityIcon className="w-4 h-4 text-purple-400" />
                                            Portrait State (v vs u)
                                        </h4>
                                        <p className="text-[10px] text-gray-400 leading-normal mb-4 font-mono">
                                            Orbits within sliced temporal limits {cropLeft}ms - {cropRight}ms.
                                        </p>
                                    </div>

                                    <div className="bg-[#09090d] border border-gray-900 rounded-lg p-1 flex justify-center items-center relative">
                                        <svg 
                                            viewBox={`0 0 ${phaseSize} ${phaseSize}`} 
                                            width="100%" 
                                            height="auto" 
                                            className="overflow-visible"
                                        >
                                            {/* Axis lines */}
                                            <line x1={phasePad} y1={phaseSize - phasePad} x2={phaseSize - phasePad} y2={phaseSize - phasePad} stroke="#1e293b" />
                                            <line x1={phasePad} y1={phasePad} x2={phasePad} y2={phaseSize - phasePad} stroke="#1e293b" />

                                            {/* Nullclines */}
                                            {phasePaths.vNullPath && (
                                                <path 
                                                    d={`M ${phasePaths.vNullPath}`}
                                                    fill="none"
                                                    stroke="#ec4899"
                                                    strokeWidth="1.5"
                                                    strokeDasharray="3 3"
                                                />
                                            )}
                                            
                                            {phasePaths.uNullPath && (
                                                <path 
                                                    d={`M ${phasePaths.uNullPath}`}
                                                    fill="none"
                                                    stroke="#10b981"
                                                    strokeWidth="1.5"
                                                    strokeDasharray="3 3"
                                                />
                                            )}

                                            {phasePaths.traj && (
                                                <path 
                                                    d={`M ${phasePaths.traj}`}
                                                    fill="none"
                                                    stroke="#06b6d4"
                                                    strokeWidth="1.5"
                                                    opacity="0.9"
                                                />
                                            )}

                                            {simulationData.length > 0 && (
                                                <circle 
                                                    cx={phaseXScale(simulationData[simulationData.length - 1].v)}
                                                    cy={phaseYScale(simulationData[simulationData.length - 1].u)}
                                                    r="4"
                                                    fill="#e2b43c"
                                                    className="animate-ping"
                                                />
                                            )}

                                            {/* Labels and ticks */}
                                            <text x={phasePad} y={phaseSize - phasePad + 12} fill="#6b7280" fontSize="8" className="font-mono" textAnchor="middle">-90</text>
                                            <text x={phaseSize - phasePad} y={phaseSize - phasePad + 12} fill="#6b7280" fontSize="8" className="font-mono" textAnchor="middle">-40</text>
                                            <text x={phasePad - 6} y={phaseSize - phasePad} fill="#6b7280" fontSize="8" className="font-mono" textAnchor="end">-25</text>
                                            <text x={phasePad - 6} y={phasePad} fill="#6b7280" fontSize="8" className="font-mono" textAnchor="end">15</text>

                                            {/* Axis titles */}
                                            <text x={phaseSize / 2} y={phaseSize - 6} fill="#9ca3af" fontSize="9" className="font-mono" textAnchor="middle">v (Membrane)</text>
                                            <text x={10} y={phaseSize / 2} fill="#9ca3af" fontSize="9" className="font-mono" textAnchor="middle" transform={`rotate(-90 10 ${phaseSize/2})`}>u (Recovery)</text>
                                        </svg>

                                        {/* Legend overlay */}
                                        <div className="absolute top-2 right-2 bg-[#121217]/90 border border-gray-800 rounded p-1.5 text-[8px] font-mono flex flex-col gap-1">
                                            <div className="flex items-center gap-1">
                                                <span className="w-2 h-0.5 bg-[#ec4899] block" />
                                                <span className="text-pink-400">v-nullcline</span>
                                            </div>
                                            <div className="flex items-center gap-1">
                                                <span className="w-2 h-0.5 bg-[#10b981] block" />
                                                <span className="text-emerald-400">u-nullcline</span>
                                            </div>
                                            <div className="flex items-center gap-1">
                                                <span className="w-2 h-0.5 bg-cyan-400 block" />
                                                <span className="text-cyan-400">trajectory</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>

                    </main>

                    {/* Information / tabs section */}
                    <div className="max-w-[1550px] mx-auto px-4 md:px-6">
                        <div className="bg-[#121217] border border-gray-800 rounded-xl p-5 shadow-2xl">
                            <div className="flex border-b border-gray-800 mb-5">
                                <button 
                                    onClick={() => setActiveTab('biophysics')}
                                    className={`pb-3 px-4 text-xs font-semibold uppercase tracking-wider flex items-center gap-2 transition-all border-b-2 ${
                                        activeTab === 'biophysics'
                                            ? 'border-[#e2b43c] text-[#e2b43c] font-bold'
                                            : 'border-transparent text-gray-500 hover:text-gray-300'
                                    }`}
                                >
                                    <FlameIcon />
                                    Biophysical Channels
                                </button>
                                <button 
                                    onClick={() => setActiveTab('transistor')}
                                    className={`pb-3 px-4 text-xs font-semibold uppercase tracking-wider flex items-center gap-2 transition-all border-b-2 ${
                                        activeTab === 'transistor'
                                            ? 'border-purple-400 text-purple-400 font-bold'
                                            : 'border-transparent text-gray-500 hover:text-gray-300'
                                    }`}
                                >
                                    <CpuIcon className="w-4 h-4 text-purple-400" />
                                    1-Transistor Circuit
                                </button>
                                <button 
                                    onClick={() => setActiveTab('code')}
                                    className={`pb-3 px-4 text-xs font-semibold uppercase tracking-wider flex items-center gap-2 transition-all border-b-2 ${
                                        activeTab === 'code'
                                            ? 'border-purple-400 text-purple-400 font-bold'
                                            : 'border-transparent text-gray-500 hover:text-gray-300'
                                    }`}
                                >
                                    <TerminalIcon />
                                    JAX Code Generator
                                </button>
                            </div>

                            {activeTab === 'biophysics' && (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 leading-relaxed text-sm text-gray-300">
                                    <div className="bg-[#171721] p-4 rounded border border-gray-800">
                                        <h4 className="font-bold text-[#e2b43c] mb-3 border-b border-gray-800 pb-1.5 text-xs tracking-wider uppercase font-mono">
                                            Membrane Currents Formulation
                                        </h4>
                                        <p className="text-xs text-gray-400 mb-3 leading-relaxed">
                                            The quadratic term <code className="text-[#e2b43c] bg-amber-950/20 px-1 py-0.5 rounded">0.04v² + 5v + 140</code> approximates the fast voltage-gated Sodium (Na⁺) channel thresholds, compressing the complex gating variables of classical Hodgkin-Huxley equations into a fast-running mathematical parabola.
                                        </p>
                                        <ul className="text-xs space-y-2 text-gray-300 font-mono">
                                            <li className="flex items-start gap-2">
                                                <span className="text-[#e2b43c] font-bold">•</span>
                                                <span><strong>I drive:</strong> External chemical input representing active synapse channels.</span>
                                            </li>
                                            <li className="flex items-start gap-2">
                                                <span className="text-[#e2b43c] font-bold">•</span>
                                                <span><strong>u variable:</strong> Slow recovery Potassium (K⁺) efflux & adaptation currents.</span>
                                            </li>
                                        </ul>
                                    </div>

                                    <div className="bg-[#171721] p-4 rounded border border-gray-800">
                                        <h4 className="font-bold text-[#e2b43c] mb-3 border-b border-gray-800 pb-1.5 text-xs tracking-wider uppercase font-mono">
                                            Intracellular Reset Machinery
                                        </h4>
                                        <p className="text-xs text-gray-400 mb-3 leading-relaxed">
                                            When membrane voltage spikes to its peak limit of <code className="text-[#e2b43c] bg-amber-950/20 px-1 py-0.5 rounded">+30 mV</code>, delayed rectifier K⁺ gates burst open, driving voltage down to reset.
                                        </p>
                                        <ul className="text-xs space-y-2 text-gray-300 font-mono">
                                            <li className="flex items-start gap-2">
                                                <span className="text-purple-400 font-bold">•</span>
                                                <span><strong>v ⟵ c:</strong> Polarized reset value for membrane post-spike.</span>
                                            </li>
                                            <li className="flex items-start gap-2">
                                                <span className="text-purple-400 font-bold">•</span>
                                                <span><strong>u ⟵ u + d:</strong> Influx of Ca²⁺ activating calcium-sensitive K⁺ adaptation gates.</span>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'transistor' && (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 leading-relaxed text-sm text-gray-300">
                                    <div className="bg-[#171721] p-4 rounded border border-gray-800">
                                        <h4 className="font-bold text-purple-400 mb-3 border-b border-gray-800 pb-1.5 text-xs tracking-wider uppercase font-mono">
                                            1-MOSFET Physical Pin-out
                                        </h4>
                                        <p className="text-xs text-gray-400 mb-3 leading-relaxed">
                                            In subthreshold cutting-edge nanometer processes, the quantum-conduction characteristics of a silicon channel mimic physiological lipid-bilayer diffusion.
                                        </p>
                                        <ul className="text-xs space-y-2 text-gray-300 font-mono">
                                            <li className="flex items-start gap-2">
                                                <span className="text-purple-400 font-bold">•</span>
                                                <span><strong>Drain (D):</strong> Action output node. Membrane capacitor <code className="text-purple-400">C_m</code> sits from Drain to Ground.</span>
                                            </li>
                                            <li className="flex items-start gap-2">
                                                <span className="text-purple-400 font-bold">•</span>
                                                <span><strong>Gate (G):</strong> Trigger threshold limit controlling the feedback channel loop.</span>
                                            </li>
                                        </ul>
                                    </div>

                                    <div className="bg-[#171721] p-4 rounded border border-gray-800">
                                        <h4 className="font-bold text-purple-400 mb-3 border-b border-gray-800 pb-1.5 text-xs tracking-wider uppercase font-mono">
                                            The Charging & Shunting Cycle
                                        </h4>
                                        <p className="text-xs text-gray-400 mb-3 leading-relaxed">
                                            As external drive current enters the Drain, the capacitor accumulates charge. The voltage rise triggers gate feedback.
                                        </p>
                                        <ul className="text-xs space-y-2 text-gray-300 font-mono">
                                            <li className="flex items-start gap-2">
                                                <span className="text-[#e2b43c] font-bold">•</span>
                                                <span><strong>Conductance:</strong> At threshold limits, transistor goes into full saturation, dumping capacitor energy to source ground.</span>
                                            </li>
                                            <li className="flex items-start gap-2">
                                                <span className="text-[#e2b43c] font-bold">•</span>
                                                <span><strong>Reset:</strong> Voltage resets down to source reference ground clamp.</span>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'code' && (
                                <div className="relative">
                                    <button 
                                        onClick={copyToClipboard}
                                        className="absolute top-3 right-3 bg-gray-800 border border-gray-700 hover:border-[#e2b43c] p-2 rounded text-xs text-gray-200 transition-all flex items-center gap-1.5 z-10 font-mono"
                                    >
                                        {copied ? (
                                            <React.Fragment>
                                                <CheckIcon />
                                                <span className="text-[#e2b43c] font-bold font-mono">Copied!</span>
                                            </React.Fragment>
                                        ) : (
                                            <React.Fragment>
                                                <CopyIcon />
                                                <span>Copy JAX parameters</span>
                                            </React.Fragment>
                                        )}
                                    </button>
                                    
                                    <pre className="bg-[#050508] border border-gray-900 rounded-lg p-5 overflow-x-auto text-[11px] font-mono leading-relaxed text-purple-300 max-h-[250px]">
                                        <code>{generatedCode}</code>
                                    </pre>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // Global constant helpers to secure nullcline mapping limits
        const nullclines = {
            vNull: [],
            uNull: []
        };
        const vRangeArray = [];
        for (let val = -95; val <= -35; val += 1) {
            vRangeArray.push(val);
        }
        
        // Static mappings for reference boundaries
        const bCoeff = 0.20;
        const currentIDrive = 10.0;
        nullclines.vNull = vRangeArray.map(v => ({ v, u: 0.04 * v * v + 5 * v + 140 + currentIDrive }));
        nullclines.uNull = vRangeArray.map(v => ({ v, u: bCoeff * v }));

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
