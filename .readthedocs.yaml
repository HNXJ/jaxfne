# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    # The atlas HTML is a build product: regenerate it and check it against
    # docs/_static/atlas_registry.json before mkdocs runs.
    pre_build:
      - pip install ".[viz]"
      - python scripts/build_docs_assets.py --build

python:
  install:
    - requirements: docs/requirements.txt

mkdocs:
  configuration: mkdocs.yml
