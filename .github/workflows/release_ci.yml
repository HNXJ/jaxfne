name: CI (Release & Scheduled)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'  # Nightly at midnight
  workflow_dispatch:

# Least-privilege: read-only checkout/test/build, no pushes or releases.
permissions:
  contents: read

jobs:
  release-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Same two-ended coverage as ci.yml: 3.11 is the oldest line the
        # pinned extras resolve on, 3.14 the newest and the interpreter the
        # local release-candidate gate runs on. 3.10 does not resolve (the
        # dev/viz extras pin scipy==1.17.1, which ships no cp310 wheels).
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev+viz deps (parity with RC gate — reportlab required)
        # RC gate runs environment_parity + viz-present reportlab tests; release CI
        # must execute the same capabilities, not skip them. See repair 2026-09-08.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz,jaxley,jnwb]"

      - name: Install docs deps (parity with RC gate — markdown/mkdocs required)
        # scripts/build_manuscript.py imports markdown at build time and
        # test_docs_links_v0330 needs mkdocs; the RC gate runs both with the
        # docs toolchain installed. Without this the manuscript tests fail
        # (no markdown) and the docs-build test skips (no mkdocs) on CI.
        run: |
          pip install -r docs/requirements.txt pyyaml

      - name: Compileall
        run: python -m compileall -q jaxfne tests examples

      - name: Run fast tests (skip slow notebook execution)
        if: github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch'
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=. python -m pytest -q --tb=short -rs -m "not slow" --junitxml=pytest-results-${{ matrix.python-version }}.xml

      - name: Run all tests (including slow)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=. python -m pytest -q --tb=short -rs --junitxml=pytest-results-${{ matrix.python-version }}.xml

      - name: Upload per-node test evidence (JUnit)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest-results-${{ matrix.python-version }}.xml
          if-no-files-found: error

      - name: Run examples
        # The list is owned by scripts/run_test_gate.py (RELEASE_EXAMPLES);
        # this step calls the `examples` gate instead of repeating it.
        run: PYTHONPATH=. python scripts/run_test_gate.py examples

  release-build:
    runs-on: ubuntu-latest
    needs: release-test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build wheel and sdist (once — these exact bytes are what ships)
        # Built a single time per run. Every downstream consumer (twine check,
        # smoke, publish) uses these bytes; nothing rebuilds. A rebuild would
        # produce a different provenance chain even when byte-identical.
        run: python -m build

      - name: Record artifact provenance
        # Binds run -> commit -> tree -> filenames -> full SHA256 in one
        # generated file. Generated, never committed: a manifest naming the
        # commit that contains it cannot be produced without self-reference.
        run: |
          python scripts/build_release_manifest.py --dist dist --source-sha "$GITHUB_SHA" --ci-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --out dist/RELEASE_MANIFEST.json
          cat dist/RELEASE_MANIFEST.json

      - name: Twine check
        run: python -m twine check dist/*.whl dist/*.tar.gz

      - name: Wheel install smoke (from /tmp)
        # The smoke body is owned by scripts/run_test_gate.py
        # (wheel_smoke_code); this step only builds the venv and calls it.
        run: |
          python -m venv /tmp/jaxfne_ci_smoke
          /tmp/jaxfne_ci_smoke/bin/python -m pip install --upgrade pip
          /tmp/jaxfne_ci_smoke/bin/python -m pip install dist/jaxfne-*.whl
          PYTHONPATH=. python scripts/run_test_gate.py wheel-smoke \
            --venv-python /tmp/jaxfne_ci_smoke/bin/python

      - name: Upload release distributions (the only publishable bytes)
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/RELEASE_MANIFEST.json
          if-no-files-found: error
          retention-days: 90

  publication:
    # Off macOS the equivalence step compares decoded pixel dimensions only; pixels and bytes are informational.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package and dev+viz deps under the figure lock
        run: |
          python -m pip install --upgrade pip
          pip install -c .github/figure_env_lock.txt -e ".[dev,viz,jaxley,jnwb]"

      - name: Record the figure environment (source for the figure lock)
        run: pip freeze --exclude-editable > figure_env_freeze.txt

      - name: The installed figure environment equals the lock
        run: grep -v '^#' .github/figure_env_lock.txt | diff - figure_env_freeze.txt

      - name: Publication gate (Figures 1-7 vs frozen PNGs, frozen-path hashes, repo state)
        run: python scripts/run_test_gate.py publication

      - name: Upload the figure environment
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: figure-env-freeze
          path: figure_env_freeze.txt
          if-no-files-found: error
