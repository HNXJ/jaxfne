name: Notebook Execution (Nightly)

on:
  schedule:
    # 03:00 UTC daily.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

# Least-privilege: read-only checkout + notebook execution, no writes.
permissions:
  contents: read

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # 3.14 to match the interpreter the local release-candidate gate
          # runs, so a notebook failure here reproduces locally.
          python-version: "3.14"

      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,jaxley]"

      - name: Run all notebook-execution tests
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=. python -m pytest -q --tb=short -m notebook
