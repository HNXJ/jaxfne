name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Build distributions (isolated outdir — never publish stale dist/)
        # dist/ is gitignored and may predate the tree locally; the release
        # artifact must always be a fresh build from the checked-out SHA.
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir /tmp/jaxfne-publish-dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: /tmp/jaxfne-publish-dist
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Build distributions (isolated outdir — never publish stale dist/)
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir /tmp/jaxfne-publish-dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: /tmp/jaxfne-publish-dist
          skip-existing: true
