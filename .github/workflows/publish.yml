name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

# Read-only. This workflow never builds and never writes to the repository;
# its only side effect is the PyPI upload, which is gated on hash equality
# with the manifest generated beside the artifacts at build time.
permissions:
  contents: read
  actions: read

jobs:
  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
      contents: read
      actions: read
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Fetch the artifacts built and validated for this exact commit
        # Deliberately does NOT run `python -m build`. A rebuild produces bytes
        # that no gate has seen: the wheel smoke, twine check and clean-room
        # verification all ran against the release-build artifacts, so those are
        # the bytes that ship. Rebuilding would break that chain even if the
        # output happened to be identical.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch_release_artifacts.sh "$GITHUB_SHA" dist

      - name: Require SHA256 equality with the release manifest
        run: |
          python scripts/build_release_manifest.py --verify dist/RELEASE_MANIFEST.json --dist dist
          rm dist/RELEASE_MANIFEST.json

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
      actions: read
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Fetch the artifacts built and validated for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch_release_artifacts.sh "$GITHUB_SHA" dist

      - name: Require SHA256 equality with the release manifest
        run: |
          python scripts/build_release_manifest.py --verify dist/RELEASE_MANIFEST.json --dist dist
          rm dist/RELEASE_MANIFEST.json

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
