name: CI (Fast)

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# Least-privilege: this workflow only checks out code, runs tests/builds,
# and uploads a coverage artifact -- it never pushes, comments, or creates
# releases, so it needs no more than read access to repo contents.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,jaxley]"

      - name: Compileall
        run: python -m compileall -q jaxfne tests examples

      - name: Lint (ruff) -- visibility only, not yet a hard gate
        # 2026-07-14: reduced from 509 to 87 errors this session (see
        # skills/FRICTIONS_STACK.md F-030 for the caught-and-corrected
        # near-miss). Remaining categories (F821/F841/F811/E741) need
        # per-site review before a hard fail is safe -- continue-on-error
        # until that pass is done, tracked in artifacts/developer/plans.json
        # (local-only) F6.
        run: python -m ruff check jaxfne/
        continue-on-error: true

      - name: Audit public docs language (no leaked doctrine, no obfuscated identifiers)
        run: PYTHONPATH=. python scripts/audit_public_docs_language.py --check

      - name: Audit notebook grammar
        run: PYTHONPATH=. python scripts/audit_notebook_grammar.py --check

      - name: Run fast tests (skip slow notebook execution)
        if: github.ref != 'refs/heads/main'
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=. python -m pytest -q --tb=short -m "not slow" -p pytest_cov \
            --cov=jaxfne --cov-report=term-missing:skip-covered --cov-report=xml

      # Real notebook execution (the `notebook` marker) is covered by the
      # dedicated, scheduled/manual notebook_execution.yml workflow instead
      # of every main push -- 28 release-facing notebooks can take well over
      # an hour combined. Other `slow` tests still run here on main.
      - name: Run all tests (including slow, excluding notebook execution)
        if: github.ref == 'refs/heads/main'
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=. python -m pytest -q --tb=short -m "not notebook" -p pytest_cov \
            --cov=jaxfne --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: Run examples
        run: |
          for ex in examples/00_minimal_column.py examples/01_source_field_manifest.py \
                    examples/01_generalized_readout_smoke.py examples/02_generalized_vis_smoke.py \
                    examples/02_omission_scaffold.py examples/03_objective_and_tune_smoke.py \
                    examples/04_blackbox_tuning_loop.py examples/05_dataset_bridge_manifest.py \
                    examples/06_edge_list_recurrent_backend.py examples/07_jaxley_trace_bridge.py \
                    examples/00_generalized_izhikevich_3d_smoke.py examples/02_spectrolaminar_oddball_scaffold.py \
                    examples/03_jaxley_bridge_smoke.py examples/05_network_100_ei_multimodal.py \
                    examples/v031_single_izhikevich_neuron.py examples/v032_single_neuron_parameter_sweep.py \
                    examples/v033_two_neuron_ei_multimodal.py examples/08_neuronal_tensor_first.py; do
            PYTHONPATH=. python "$ex" > /dev/null && echo "PASS: $ex" || { echo "FAIL: $ex"; exit 1; }
          done

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - name: Wheel install smoke (from /tmp)
        run: |
          python -m venv /tmp/jaxfne_ci_smoke
          /tmp/jaxfne_ci_smoke/bin/python -m pip install --upgrade pip
          /tmp/jaxfne_ci_smoke/bin/python -m pip install dist/jaxfne-*.whl
          cd /tmp && /tmp/jaxfne_ci_smoke/bin/python -c "
          import json, jaxfne as jtfne
          assert 'site-packages' in jtfne.__file__
          cfg = jtfne.configuration().network(n=8).emitter().field().probe(n_contacts=4)
          model = jtfne.construct(cfg)
          signals = model.simulate(jtfne.simulation(duration_ms=5.0, dt_ms=0.1, seed=0))
          readouts = model.compute_readout(signals, [jtfne.readout_spec('r', 'spike_rate_hz')])
          manifest = model.manifest(signals, readouts)
          json.dumps(manifest, allow_nan=False)
          assert manifest['physical_amplitude_calibrated'] is False
          print('CI wheel smoke OK', jtfne.__version__)
          "
