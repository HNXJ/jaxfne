name: CI (Fast)

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]

# Least-privilege: this workflow only checks out code, runs tests/builds,
# and uploads a coverage artifact -- it never pushes, comments, or creates
# releases, so it needs no more than read access to repo contents.
permissions:
  contents: read

jobs:
  fast-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Coverage is deliberately the two ends of the supported range rather
        # than every minor version: 3.11 as the oldest line the pinned extras
        # resolve on, 3.14 as the newest and the interpreter the local
        # release-candidate gate runs, so the gate no longer certifies on a
        # version CI never exercises. 3.10 does not resolve at all (the dev/viz
        # extras pin scipy==1.17.1, which ships no cp310 wheels).
        # Wheel availability for both lines was checked against the index:
        # scipy 1.17.1, matplotlib 3.10.9 and jaxlib 0.10.2 all publish cp311
        # and cp314 manylinux wheels.
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev deps (dev — no viz/reportlab)
        if: github.ref != 'refs/heads/main'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,jaxley,jnwb]"

      - name: Install package and dev+viz deps (main — with reportlab)
        if: github.ref == 'refs/heads/main'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz,jaxley,jnwb]"

      - name: Compileall
        run: python -m compileall -q jaxfne tests examples

      - name: Lint (ruff) -- hard gate
        # 2026-07-18: 0 errors (was 509 on 2026-07-14, then 87, then 20).
        # The last 20 were all individually verified, not blanket-suppressed:
        # 7 F401 + 2 E402 were the same re-export/staged-import false-positive
        # pattern jaxfne/__init__.py/core.py already carry a documented
        # per-file-ignore for (a ruff --fix dry-run confirmed blind --fix
        # would have deleted a real re-export block, same class of incident
        # as the 2026-07-14 core.py/_construct.py near-miss); 6 F811 were
        # legitimate local shadowing of a module-level name by a public
        # function parameter or dataclass field (e.g. simulate(...,
        # paradigm=...), ReadoutResult.warnings); 1 F821 was a string-quoted
        # forward-reference type hint, fixed properly with a TYPE_CHECKING
        # import rather than suppressed. See pyproject.toml's
        # [tool.ruff.lint.per-file-ignores] comments for the exact rationale
        # per file. Now a real, enforced gate -- no continue-on-error.
        run: python -m ruff check jaxfne/

      - name: Lint scripts/tests/examples (ruff defect-class rules) -- hard gate
        run: python -m ruff check scripts/ tests/ examples/ --select E711,E712,E721,E722,F601,F632,F811,F821,F823,F402

      - name: Audit public docs language (no leaked doctrine, no obfuscated identifiers)
        run: PYTHONPATH=. python scripts/audit_public_docs_language.py --check

      - name: Atlas firewall gate (AT scenarios use public surface only) + Y schema v4
        run: python -m pytest tests/test_atlas_firewall.py tests/test_atlas_y_schema.py tests/test_check_atlas_coverage.py -q

      - name: Atlas coverage check
        run: PYTHONPATH=. python scripts/check_atlas_coverage.py --check

      - name: Audit notebook grammar
        run: PYTHONPATH=. python scripts/audit_notebook_grammar.py --check

      - name: Install docs deps
        run: pip install -r docs/requirements.txt pyyaml

      - name: Docs build (strict)
        run: python -m mkdocs build --strict

      - name: Docs orphan-page check
        # mkdocs itself only flags an orphan page (built but not in nav) as a
        # cosmetic INFO note, never a --strict failure (see mkdocs.yml's own
        # exclude_docs comment) -- this closes that gap for real. Catches the
        # class of regression fixed manually 2026-07-08 (16 orphaned pages).
        run: PYTHONPATH=. python scripts/check_docs_orphans.py

      - name: Docs↔code integrity audit (signatures resolve, examples parse)
        # Fence parsing + live-symbol resolution + skill-ref check (P-006).
        # Catches the recurring drift class where docs build but lie about
        # the API; runs inside broad/release/rc gates too via run_test_gate.
        run: PYTHONPATH=. python scripts/audit_doc_code_integrity.py --check

      - name: Tracked tree-size gate (blobs, budget + caps)
        # Fails when the tracked tree grows back: over-cap files must be
        # allow-listed, listed files may not grow >10%, total must fit budget.
        run: PYTHONPATH=. python scripts/check_tree_size.py --check

      - name: Run fast tests (curated dev gate ~90s, viz boundary — reportlab skips)
        if: github.ref != 'refs/heads/main'
        run: |
          # Invariant: G_dev ⊂ G_broad ⊆ G_release (dev optimized for fast regression, not exhaustive).
          # Dev installs .[dev,jaxley] only (no reportlab) → builder reportlab tests skip via pytest.skip
          # (intentional capability boundary, not environmental debt). Broad/release install .[dev,viz,jaxley]
          # and must run all 8 builder tests.
          PYTHONPATH=. python scripts/run_test_gate.py dev

      # This job's broad gate selects `-m "not slow"`, so it does not execute
      # the `notebook` marker itself. Those tests are not excluded repository
      # wide: release_ci.yml runs `pytest` unfiltered on every push to main,
      # which selects the notebook set too, and notebook_execution.yml runs
      # that marker on a schedule. The release-candidate gate executes it as a
      # blocking family, so the RC gate covers the release CI test population
      # (see docs/reference/project/ci_policy.md). Other `slow` tests still run here on main.
      - name: Run all tests (broad gate — comprehensive non-slow, with viz)
        if: github.ref == 'refs/heads/main'
        run: |
          # Broad gate: -m "not slow", with viz/reportlab present → all 8 builder tests run.
          PYTHONPATH=. python scripts/run_test_gate.py broad

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: Run examples
        # The list is owned by scripts/run_test_gate.py (RELEASE_EXAMPLES);
        # this step calls the `examples` gate instead of repeating it.
        run: PYTHONPATH=. python scripts/run_test_gate.py examples

  fast-build:
    runs-on: ubuntu-latest
    needs: fast-test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - name: Wheel install smoke (from /tmp)
        # The smoke body is owned by scripts/run_test_gate.py
        # (wheel_smoke_code); this step only builds the venv and calls it.
        run: |
          python -m venv /tmp/jaxfne_ci_smoke
          /tmp/jaxfne_ci_smoke/bin/python -m pip install --upgrade pip
          /tmp/jaxfne_ci_smoke/bin/python -m pip install dist/jaxfne-*.whl
          PYTHONPATH=. python scripts/run_test_gate.py wheel-smoke \
            --venv-python /tmp/jaxfne_ci_smoke/bin/python
