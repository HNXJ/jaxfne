name: CI (Fast)

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]

# Least-privilege: this workflow only checks out code, runs tests/builds,
# and uploads a coverage artifact -- it never pushes, comments, or creates
# releases, so it needs no more than read access to repo contents.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 dropped: the dev/viz extras pin scipy==1.17.1, which ships no
        # cp310 wheels, so `pip install -e ".[dev,jaxley]"` cannot resolve on
        # 3.10 (ResolutionImpossible, confirmed 2026-08-16 on every dev push).
        # Executed/receipt environment is Python 3.13 (jax 0.10.1, scipy 1.17.1);
        # 3.12 kept as the oldest actively wheel-supported line.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev deps (dev — no viz/reportlab)
        if: github.ref != 'refs/heads/main'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,jaxley]"

      - name: Install package and dev+viz deps (main — with reportlab)
        if: github.ref == 'refs/heads/main'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz,jaxley]"

      - name: Compileall
        run: python -m compileall -q jaxfne tests examples

      - name: Lint (ruff) -- hard gate
        # 2026-07-18: 0 errors (was 509 on 2026-07-14, then 87, then 20).
        # The last 20 were all individually verified, not blanket-suppressed:
        # 7 F401 + 2 E402 were the same re-export/staged-import false-positive
        # pattern jaxfne/__init__.py/core.py already carry a documented
        # per-file-ignore for (a ruff --fix dry-run confirmed blind --fix
        # would have deleted a real re-export block, same class of incident
        # as the 2026-07-14 core.py/_construct.py near-miss); 6 F811 were
        # legitimate local shadowing of a module-level name by a public
        # function parameter or dataclass field (e.g. simulate(...,
        # paradigm=...), ReadoutResult.warnings); 1 F821 was a string-quoted
        # forward-reference type hint, fixed properly with a TYPE_CHECKING
        # import rather than suppressed. See pyproject.toml's
        # [tool.ruff.lint.per-file-ignores] comments for the exact rationale
        # per file. Now a real, enforced gate -- no continue-on-error.
        run: python -m ruff check jaxfne/

      - name: Audit public docs language (no leaked doctrine, no obfuscated identifiers)
        run: PYTHONPATH=. python scripts/audit_public_docs_language.py --check

      - name: Audit notebook grammar
        run: PYTHONPATH=. python scripts/audit_notebook_grammar.py --check

      - name: Install docs deps
        run: pip install -r docs/requirements.txt pyyaml

      - name: Docs build (strict)
        run: python -m mkdocs build --strict

      - name: Docs orphan-page check
        # mkdocs itself only flags an orphan page (built but not in nav) as a
        # cosmetic INFO note, never a --strict failure (see mkdocs.yml's own
        # exclude_docs comment) -- this closes that gap for real. Catches the
        # class of regression fixed manually 2026-07-08 (16 orphaned pages).
        run: PYTHONPATH=. python scripts/check_docs_orphans.py

      - name: Run fast tests (curated dev gate ~90s, viz boundary — reportlab skips)
        if: github.ref != 'refs/heads/main'
        run: |
          # Invariant: G_dev ⊂ G_broad ⊆ G_release (dev optimized for fast regression, not exhaustive).
          # Dev installs .[dev,jaxley] only (no reportlab) → builder reportlab tests skip via pytest.skip
          # (intentional capability boundary, not environmental debt). Broad/release install .[dev,viz,jaxley]
          # and must run all 8 builder tests.
          PYTHONPATH=. python scripts/run_test_gate.py dev

      # Real notebook execution (the `notebook` marker) is covered by the
      # dedicated, scheduled/manual notebook_execution.yml workflow instead
      # of every main push -- 28 release-facing notebooks can take well over
      # an hour combined. Other `slow` tests still run here on main.
      - name: Run all tests (broad gate — comprehensive non-slow, with viz)
        if: github.ref == 'refs/heads/main'
        run: |
          # Broad gate: not slow (3573 tests) with viz/reportlab present → all 8 builder tests run.
          PYTHONPATH=. python scripts/run_test_gate.py broad

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: Run examples
        run: |
          for ex in examples/00_minimal_column.py examples/01_source_field_manifest.py \
                    examples/01_generalized_readout_smoke.py examples/02_generalized_vis_smoke.py \
                    examples/02_omission_scaffold.py examples/03_objective_and_tune_smoke.py \
                    examples/04_blackbox_tuning_loop.py examples/05_dataset_bridge_manifest.py \
                    examples/06_edge_list_recurrent_backend.py examples/07_jaxley_trace_bridge.py \
                    examples/00_generalized_izhikevich_3d_smoke.py examples/02_spectrolaminar_oddball_scaffold.py \
                    examples/03_jaxley_bridge_smoke.py examples/05_network_100_ei_multimodal.py \
                    examples/v031_single_izhikevich_neuron.py examples/v032_single_neuron_parameter_sweep.py \
                    examples/v033_two_neuron_ei_multimodal.py examples/08_neuronal_tensor_first.py; do
            PYTHONPATH=. python "$ex" > /dev/null && echo "PASS: $ex" || { echo "FAIL: $ex"; exit 1; }
          done

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - name: Wheel install smoke (from /tmp)
        run: |
          python -m venv /tmp/jaxfne_ci_smoke
          /tmp/jaxfne_ci_smoke/bin/python -m pip install --upgrade pip
          /tmp/jaxfne_ci_smoke/bin/python -m pip install dist/jaxfne-*.whl
          cd /tmp && /tmp/jaxfne_ci_smoke/bin/python -c "
          import json, jaxfne as jtfne
          assert 'site-packages' in jtfne.__file__
          cfg = jtfne.configuration().network(n=8).emitter().field().probe(n_contacts=4)
          model = jtfne.construct(cfg)
          signals = model.simulate(jtfne.simulation(duration_ms=5.0, dt_ms=0.1, seed=0))
          readouts = model.compute_readout(signals, [jtfne.readout_spec('r', 'spike_rate_hz')])
          manifest = model.manifest(signals, readouts)
          json.dumps(manifest, allow_nan=False)
          assert manifest['physical_amplitude_calibrated'] is False
          print('CI wheel smoke OK', jtfne.__version__)
          "
