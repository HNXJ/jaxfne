[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jaxfne"
version = "0.4.5"
description = "JAX Field Neural Equations: a source-to-field neurophysiology engine for TFNE models."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "H N"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "jax>=0.4.25",
  "jaxlib>=0.4.25",
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/HNXJ/jaxfne"
Repository = "https://github.com/HNXJ/jaxfne"
Documentation = "https://jaxfne.readthedocs.io/en/latest/"
Issues = "https://github.com/HNXJ/jaxfne/issues"
Changelog = "https://github.com/HNXJ/jaxfne/blob/main/docs/changelog.md"

[project.optional-dependencies]
opt = ["optax>=0.2"]
jaxley = ["jaxley>=0.13.0"]  # tested floor; bridge installs a JAX clip-compat shim for jaxley<=0.13
viz = ["matplotlib", "plotly", "kaleido", "pandas", "ipywidgets"]
io = ["pyyaml", "zarr", "h5py"]
dev = ["pytest", "pytest-xdist", "ruff", "optax>=0.2", "matplotlib", "plotly", "kaleido", "pandas", "ipywidgets", "nbformat", "nbclient", "ipykernel"]
all = ["jaxfne[opt,jaxley,viz,io,dev]"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
only-packages = true

[tool.hatch.build.targets.wheel.force-include]
"jaxfne/configs" = "jaxfne/configs"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/.venv*",
  "/.pytest_cache",
  "/docs/tutorials_v030",
  "/internal_docs",
  "/.claude",
  "/.ipynb_checkpoints",
  "/outputs",
  "/test_execution_output",
  "/site",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running tests",
  "release: release-gate tests including docs/notebooks/full examples",
  "notebook: notebook execution tests",
]
