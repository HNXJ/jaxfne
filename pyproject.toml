[build-system]
# Temporary publishing bound: Core Metadata 2.5 is standardized, but the
# current Twine/upload toolchain does not yet consistently accept it.
# Hatchling <1.30 retains Metadata 2.4 generation. Reevaluate after the
# project toolchain accepts Metadata 2.5.
requires = ["hatchling>=1.27,<1.30"]
build-backend = "hatchling.build"

[project]
name = "jaxfne"
version = "0.4.20"
description = "JAX Field Neural Equations: a source-to-field neurophysiology engine for TFNE models."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Hamed Nejat"}]
keywords = [
  "neuroscience",
  "neural simulation",
  "JAX",
  "laminar cortex",
  "LFP",
  "computational neuroscience",
  "Izhikevich",
  "spectrolaminar",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "jax>=0.4.25,<0.11",
  "jaxlib>=0.4.25,<0.11",
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/HNXJ/jaxfne"
Repository = "https://github.com/HNXJ/jaxfne"
Documentation = "https://jaxfne.readthedocs.io/en/latest/"
Issues = "https://github.com/HNXJ/jaxfne/issues"
Changelog = "https://github.com/HNXJ/jaxfne/blob/main/docs/changelog.md"
Citation = "https://github.com/HNXJ/jaxfne/blob/main/CITATION.cff"
"Source Code" = "https://github.com/HNXJ/jaxfne"

[project.optional-dependencies]
opt = ["optax>=0.2"]
jaxley = ["jaxley>=0.13.0"]  # tested floor; bridge installs a JAX clip-compat shim for jaxley<=0.13
jax-fem = ["jax-fem>=0.0.12"]  # GPLv3 (or paid commercial from the author) -- optional, NOT a core dependency; see docs/guides/jax_fem_interop.md
viz = ["matplotlib>=3.10.9,<3.11", "scipy==1.17.1", "plotly", "kaleido", "pandas", "ipywidgets", "Pillow", "reportlab"]
io = ["pyyaml", "zarr", "h5py"]
dev = ["pytest", "pytest-cov", "pytest-xdist", "ruff==0.16.2", "build", "optax>=0.2", "matplotlib>=3.10.9,<3.11", "scipy==1.17.1", "plotly", "kaleido", "pandas", "ipywidgets", "nbformat", "nbclient", "ipykernel"]
all = ["jaxfne[opt,jaxley,viz,io,dev]"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Declared repository lint contract, independent of Ruff version defaults.
# The CI hard gate and the 2026-07 cleanup enforced Pyflakes (F) plus
# pycodestyle error families E4/E7/E9 (import, statement, runtime). Broader
# families (UP, I, B, RUF, SIM, …) are not this release gate.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Re-export aggregator files: import names purely to make them available at a
# higher import path (jaxfne.X, jaxfne.core.X) without referencing them
# internally. F401 "unused import" is a false positive for this pattern, not a
# real dead import -- confirmed 2026-07-14 the hard way (a blanket `ruff --fix`
# gutted core.py's and _construct.py's entire re-export blocks, breaking
# `import jaxfne` outright; reverted, this ignore list added before re-running
# --fix so it can't happen again).
# jaxfne/__init__.py's import order is also staged deliberately (load-order
# dependencies between submodules) -- all 31 E402 hits are here; reordering
# to "fix" them risks reintroducing whatever load-order issue the staging
# avoids. Not touching without a dedicated audit of why each import is
# where it is.
#
# 2026-07-18 additions, each individually verified before adding (not a blind
# blanket suppression): jaxfne/emitters.py's F401 is the exact same re-export
# false-positive as above (a `ruff --fix` dry-run confirmed it would delete
# the entire homeostatic_ei re-export block). jaxfne/_construct.py's and
# jaxfne/_signals.py's F811 hits are all legitimate local shadowing of a
# module-level name by a function parameter or dataclass field (e.g.
# `simulate(..., paradigm=...)`, `ReadoutResult.warnings`/`Signals.warnings`)
# -- real public API names, not accidental redefinitions; renaming them to
# silence the lint would be a breaking change for a cosmetic warning.
# jaxfne/paradigm.py and jaxfne/tutorial_utils.py's E402 hits are deliberate
# deferred imports placed after the code that motivates deferring them
# (matching the same staging rationale as jaxfne/__init__.py above).
# jaxfne/optim/__init__.py's E402 hits are the same staged re-export pattern
# as jaxfne/__init__.py: the AGSDR_SURFACE_CLASSIFICATION constant (the
# file's single source of truth, referenced by tests) is placed first for
# documentation-first readability, and the `from .<module> import ...` block
# re-exports the sub-package surface below it. Moving the imports above the
# constant would not change load order semantics but would split the
# re-export block away from its classification doc; ignored with the same
# rationale as the other aggregator files.
#
# 2026-07-20: jaxfne/_model.py's E402 hits are the same deferred-import
# pattern -- Phase 2 defragmentation split _model.py's non-lifecycle Model
# methods into 5 sibling _model_*.py files, each of which does
# `from ._model import X` at ITS OWN module level for shared constants/
# classes (MatrixParameterSpec, TuneResult, _SOURCE_PROXY_METADATA, etc).
# _model.py must therefore define those shared items BEFORE importing the 5
# submodules' implementations, which necessarily happens after the file's
# top-of-file external imports. Reordering to "fix" E402 here would break
# the import (the submodules would try to import from a not-yet-populated
# _model module).
"jaxfne/__init__.py" = ["F401", "E402"]
"jaxfne/core.py" = ["F401"]
"jaxfne/_construct.py" = ["F401", "F811"]
"jaxfne/_signals.py" = ["F401", "E402", "F811"]
"jaxfne/_model.py" = ["F401", "E402"]
"jaxfne/fields/proxy.py" = ["F401"]
"jaxfne/optim/__init__.py" = ["F401", "E402"]
"jaxfne/vis/__init__.py" = ["F401"]
"jaxfne/emitters.py" = ["F401", "E402"]
"jaxfne/paradigm.py" = ["E402"]
"jaxfne/tutorial_utils.py" = ["E402"]
#
# 2026-08-16 additions (CI-green repair; dev was red only on the install
# step for weeks, so the ruff gate never ran). Each finding was individually
# verified INERT before adding -- not a blind blanket suppression, and no
# executed module was edited:
#  - Executed protocol modules are receipt-frozen: their module hashes are
#    load-bearing (estimator SHA 684859a...; W3b frozen at 2187 rows; all
#    protocol receipts record package_head). F401 unused imports and F841
#    unused locals are side-effect-inert and behavior-neutral by definition;
#    deleting them would change the hashes recorded in frozen receipts, so
#    they are deferred to the post-publication cleanup with a dedicated
#    audit. Verified per line before listing.
#  - estimator.py F841 (min_coh): reads spec key "minimum_spatial_coherence"
#    (0.55) which is never applied -- the coherence gate uses
#    "coherence_traveling_threshold" (also 0.55), so the binding is a dead
#    duplicate of the enforced threshold, behavior-inert. Module SHA
#    re-registration would be required to remove it; deferred.
#  - c3_protocol.py E714: `not x is False` is a Python-valid identity test
#    on a bool from .get(); semantics identical to `x is not False`, inert.
#  - w3b_parameter_domain.py F601 x8: the row-construction dict literal
#    re-declares eight keys (I_tonic, Gamma_HDP, b_HW, L_HDP, mean_syn,
#    m_F, regime, in_D_useful) whose second occurrence supersedes the first
#    with identically-computed values (bins: 265-276 vs 285-294). Later-wins
#    is the effective behavior; receipts capture the same values; flagged
#    for simplification in the post-publication cleanup.
#  - h3/h4 E741: ambiguous single-letter locals `l` in executed modules;
#    renaming deferred for the same byte-identity reason.
"jaxfne/experiment_a/canonical.py" = ["F401"]
"jaxfne/experiment_a/receipt.py" = ["F401"]
"jaxfne/h3_decodability.py" = ["E741"]
"jaxfne/h4_matrix.py" = ["F401", "E741"]
"jaxfne/protocol_c/c3_protocol.py" = ["E714"]
"jaxfne/protocol_c/c4_interpretation.py" = ["F841"]
"jaxfne/protocol_c/estimator.py" = ["F841"]
"jaxfne/protocol_d_biological_rbs/d1_execution.py" = ["F841"]
"jaxfne/protocol_d_biological_rbs/d2a_execution.py" = ["F841"]
"jaxfne/protocol_d_biological_rbs/d2b_execution.py" = ["F401", "F841"]
"jaxfne/protocol_d_biological_rbs/d3_interpretation.py" = ["F401"]
"jaxfne/protocol_e_integration/e1_execution.py" = ["F401"]
"jaxfne/protocol_e_integration/e2_execution.py" = ["F401"]
"jaxfne/protocol_e_integration/e5_execution.py" = ["F401"]
"jaxfne/publication/fig06_evidence.py" = ["F401"]
"jaxfne/w1a_omega_plasticity.py" = ["F401"]
"jaxfne/w1b_shadow_plasticity.py" = ["F841"]
"jaxfne/w3a_stability_analysis.py" = ["F841"]
"jaxfne/w3b_parameter_domain.py" = ["F601"]

[tool.hatch.build.targets.wheel]
only-packages = true
packages = ["jaxfne"]
exclude = [
  "jaxfne/publication",
]

[tool.hatch.build.targets.wheel.force-include]
"jaxfne/configs" = "jaxfne/configs"
"jaxfne/jdna/genomes" = "jaxfne/jdna/genomes"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/.venv*",
  "/.pytest_cache",
  "/.opencode",
  "/.cursor",
  "/.claude",
  "/.ipynb_checkpoints",
  "/AGENTS.md",
  "/node_modules",
  "/receipts",
  "/docs/tutorials_v030",
  "/internal_docs",
  "/outputs",
  "/test_execution_output",
  "scratch",
  "skills",
  "scripts/harness",
  "artifacts/private_acceptance",
  "artifacts/.lab",
  "artifacts/legacy/**",
  "artifacts/legacy",
  "artifacts/msvc_hdp_diagnostic",
  "artifacts/tutorials",
  "scripts/hdp_mvc_*.py",
  "jaxfne/publication",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "smoke: T0 tiny mathematical invariants, hygiene, and surface contracts (~10s)",
  "fast: T1 fast development unit tests (<= 60s)",
  "integration: multi-component end-to-end integration workflows",
  "slow: long-running multi-trial simulations and parameter sweeps",
  "notebook: interactive tutorial notebook execution tests",
  "release: complete T2 release-gate tests including docs and full examples",
]
