[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jaxfne"
version = "0.4.6"
description = "JAX Field Neural Equations: a source-to-field neurophysiology engine for TFNE models."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "H N"}]
keywords = [
  "neuroscience",
  "neural simulation",
  "JAX",
  "laminar cortex",
  "LFP",
  "computational neuroscience",
  "Izhikevich",
  "spectrolaminar",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "jax>=0.4.25",
  "jaxlib>=0.4.25",
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/HNXJ/jaxfne"
Repository = "https://github.com/HNXJ/jaxfne"
Documentation = "https://jaxfne.readthedocs.io/en/latest/"
Issues = "https://github.com/HNXJ/jaxfne/issues"
Changelog = "https://github.com/HNXJ/jaxfne/blob/main/docs/changelog.md"
Citation = "https://github.com/HNXJ/jaxfne/blob/main/CITATION.cff"
"Source Code" = "https://github.com/HNXJ/jaxfne"

[project.optional-dependencies]
opt = ["optax>=0.2"]
jaxley = ["jaxley>=0.13.0"]  # tested floor; bridge installs a JAX clip-compat shim for jaxley<=0.13
jax-fem = ["jax-fem>=0.0.12"]  # GPLv3 (or paid commercial from the author) -- optional, NOT a core dependency; see docs/guides/jax_fem_interop.md
viz = ["matplotlib", "plotly", "kaleido", "pandas", "ipywidgets"]
io = ["pyyaml", "zarr", "h5py"]
dev = ["pytest", "pytest-cov", "pytest-xdist", "ruff", "optax>=0.2", "matplotlib", "plotly", "kaleido", "pandas", "ipywidgets", "nbformat", "nbclient", "ipykernel"]
all = ["jaxfne[opt,jaxley,viz,io,dev]"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Re-export aggregator files: import names purely to make them available at a
# higher import path (jaxfne.X, jaxfne.core.X) without referencing them
# internally. F401 "unused import" is a false positive for this pattern, not a
# real dead import -- confirmed 2026-07-14 the hard way (a blanket `ruff --fix`
# gutted core.py's and _construct.py's entire re-export blocks, breaking
# `import jaxfne` outright; reverted, this ignore list added before re-running
# --fix so it can't happen again).
# jaxfne/__init__.py's import order is also staged deliberately (load-order
# dependencies between submodules) -- all 31 E402 hits are here; reordering
# to "fix" them risks reintroducing whatever load-order issue the staging
# avoids. Not touching without a dedicated audit of why each import is
# where it is.
"jaxfne/__init__.py" = ["F401", "E402"]
"jaxfne/core.py" = ["F401"]
"jaxfne/_construct.py" = ["F401"]
"jaxfne/_signals.py" = ["F401"]
"jaxfne/_model.py" = ["F401"]
"jaxfne/fields/proxy.py" = ["F401"]
"jaxfne/optim/__init__.py" = ["F401"]
"jaxfne/vis/__init__.py" = ["F401"]

[tool.hatch.build.targets.wheel]
only-packages = true

[tool.hatch.build.targets.wheel.force-include]
"jaxfne/configs" = "jaxfne/configs"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/.venv*",
  "/.pytest_cache",
  "/docs/tutorials_v030",
  "/internal_docs",
  "/.claude",
  "/.ipynb_checkpoints",
  "/outputs",
  "/test_execution_output",
  "/site",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running tests",
  "release: release-gate tests including docs/notebooks/full examples",
  "notebook: notebook execution tests",
]
